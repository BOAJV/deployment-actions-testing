apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-app-credential-test
  namespace: argocd-test
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-github-app-repo-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/Hexagon-Mining-Infrastructure/deployment-actions-testing.git
        githubAppID: "{{ .appid }}"
        githubAppInstallationID: "{{ .installationid }}"
        githubAppPrivateKey: |
          {{ .privatekey }}
  data:
  - secretKey: appid
    remoteRef:
      key: argocd-github-app-credential
      property: app-id
  - secretKey: installationid
    remoteRef:
      key: argocd-github-app-credential
      property: installation-id  
  - secretKey: privatekey
    remoteRef:
      key: argocd-github-app-credential
      property: private-key