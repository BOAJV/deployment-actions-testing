---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: webapp-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-test
                port:
                  number: 80