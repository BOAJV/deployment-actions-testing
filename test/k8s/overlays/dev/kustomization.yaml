apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-dev

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

commonLabels:
  environment: dev

configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - ENV=development
      - LOG_LEVEL=debug