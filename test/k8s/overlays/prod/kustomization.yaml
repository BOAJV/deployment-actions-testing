apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-prod

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

commonLabels:
  environment: production

configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - ENV=production
      - LOG_LEVEL=warn