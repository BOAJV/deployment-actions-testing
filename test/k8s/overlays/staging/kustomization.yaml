apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-staging

resources:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml

commonLabels:
  environment: staging

configMapGenerator:
  - name: webapp-config
    behavior: merge
    literals:
      - ENV=staging
      - LOG_LEVEL=info