# Development environment overrides
replicaCount: 1

image:
  tag: "dev-latest"

env:
  NODE_ENV: development
  LOG_LEVEL: debug

ingress:
  enabled: true
  hosts:
    - host: webapp-dev.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi