# Staging environment overrides
replicaCount: 2

image:
  tag: "staging-latest"

env:
  NODE_ENV: staging
  LOG_LEVEL: info

ingress:
  enabled: true
  hosts:
    - host: webapp-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: webapp-staging-tls
      hosts:
        - webapp-staging.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70