# Production environment overrides
replicaCount: 3

image:
  tag: "1.21"

env:
  NODE_ENV: production
  LOG_LEVEL: warn

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: webapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: webapp-prod-tls
      hosts:
        - webapp.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

nodeSelector:
  node-type: production

tolerations:
- key: "production"
  operator: "Equal"
  value: "true"
  effect: "NoSchedule"